name: C Makefile Github Actions test

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - uses: actions/checkout@v3
    - name: Compile the project
      run: ./ag.sh build release
    - name: Run the project
      run: ./ag.sh run release
    - name: Clean
      run: ./sc.sh clean